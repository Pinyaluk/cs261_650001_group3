<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | ระบบแจ้งซ่อมหอพัก</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="page">
    <header class="page-header">
      <p class="eyebrow">ระบบแจ้งซ่อมหอพัก</p>
      <h1 class="page-title">เข้าสู่ระบบ</h1>
      <p class="page-subtitle">เข้าสู่ระบบเพื่อแจ้งซ่อมและติดตามคำร้อง</p>
    </header>

    <section class="card" aria-labelledby="login-heading">
      <h2 class="card__title" id="login-heading">ยินดีต้อนรับ</h2>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">ชื่อผู้ใช้ <span class="required">*</span></label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" placeholder="กรอกชื่อผู้ใช้" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">รหัสผ่าน <span class="required">*</span></label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
        </div>
        <label class="checkbox" for="remember-me">
          <input id="remember-me" name="remember-me" type="checkbox">
          จดจำบัญชี
        </label>
        <p class="error-msg" id="login-error" role="alert">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">เข้าสู่ระบบ</button>
        <a class="link" id="forgot-password-link" href="#forgot-password">ลืมรหัสผ่าน?</a>
      </form>
    </section>

  <p class="footer-note">หอพักอุ่นใจ • สำนักงานหอพัก 02-555-0180</p>
  <script src="../js/api-client.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
